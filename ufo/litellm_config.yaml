model_list:
  - model_name: "ufo-host-model"
    litellm_params:
      model: "openai/qwen3-vl"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      num_retries: 2
  - model_name: "ufo-app-model"
    litellm_params:
      model: "openai/gemma4"
      api_base: "http://127.0.0.1:8081/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      num_retries: 2
  - model_name: "ufo-model"
    litellm_params:
      model: "openai/qwen3-vl"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
  # NOTE: LiteLLM's "os.environ/VAR" substitution replaces an entire field value,
  # it cannot interpolate a var into part of a string (unlike UFO's own
  # config_loader._expand_env_vars used for agents_dgx.yaml). So api_base here
  # is a literal and must be kept in sync if the DGX's address changes.
  # Currently gx10's stable Tailscale IP (100.111.170.95) -- prefer this over
  # the LAN IP since it stays valid across network changes.
  - model_name: "ufo-dgx-model"
    litellm_params:
      model: "openai/qwen-abliterated"
      api_base: "http://100.111.170.95:8000/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
  - model_name: "ufo-dgx-app-model"
    litellm_params:
      model: "openai/gemma4-ufo"
      api_base: "http://100.111.170.95:11434/v1"
      api_key: "ollama"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
  - model_name: "claude-3-7-sonnet"
    litellm_params:
      model: "anthropic/claude-3-7-sonnet-latest"
      api_key: "os.environ/ANTHROPIC_API_KEY"
      max_tokens: 16384
  - model_name: "deepseek-r1"
    litellm_params:
      model: "deepseek/deepseek-reasoner"
      api_key: "os.environ/DEEPSEEK_API_KEY"
      max_tokens: 8000

  - model_name: "featherless-qwen-primary"
    litellm_params:
      model: "openai/mlabonne/Qwen2.5-72B-Instruct-abliterated"
      api_base: "https://api.featherless.ai/v1"
      api_key: "os.environ/FEATHERLESS_API_KEY"
      rpm: 1000
      max_tokens: 4000
  - model_name: "featherless-qwen-secondary"
    litellm_params:
      model: "openai/hugging-quants/Qwen2-72B-Instruct-abliterated"
      api_base: "https://api.featherless.ai/v1"
      api_key: "os.environ/FEATHERLESS_API_KEY"
      rpm: 1000
      max_tokens: 4000
  - model_name: "featherless-qwen-tertiary"
    litellm_params:
      model: "openai/failpy/Qwen2.5-Coder-32B-Instruct-abliterated"
      api_base: "https://api.featherless.ai/v1"
      api_key: "os.environ/FEATHERLESS_API_KEY"
      rpm: 1000
      max_tokens: 4000

router_settings:
  fallbacks:
    - {"ufo-host-model": ["claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-app-model": ["claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-model": ["claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-dgx-model": ["ufo-dgx-app-model", "claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-dgx-app-model": ["ufo-dgx-model", "claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}

