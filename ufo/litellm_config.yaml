model_list:
  # The agent LLM is the DGX Spark's llama.cpp server, reached through the
  # SSH tunnel on 127.0.0.1:8000 (scripts/gx10_up.ps1). It is the only LLM
  # currently serving, so host/app/all point at it; the cloud entries below
  # are the intended fallbacks and stay inert until their keys are valid.
  #
  # `chat_template_kwargs: {enable_thinking: false}` is REQUIRED: without it
  # qwen38-27b-turbo emits a long `reasoning_content` block that consumes the
  # whole completion budget and returns an empty `content`.
  - model_name: "ufo-host-model"
    litellm_params:
      model: "openai/qwen38-27b-turbo"
      api_base: "http://127.0.0.1:8000/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      num_retries: 2
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: "ufo-app-model"
    litellm_params:
      model: "openai/qwen38-27b-turbo"
      api_base: "http://127.0.0.1:8000/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      num_retries: 2
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: "ufo-model"
    litellm_params:
      model: "openai/qwen38-27b-turbo"
      api_base: "http://127.0.0.1:8000/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  # NOTE: LiteLLM's "os.environ/VAR" substitution replaces an entire field value,
  # it cannot interpolate a var into part of a string (unlike UFO's own
  # config_loader._expand_env_vars used for agents_dgx.yaml). So api_base here
  # is a literal and must be kept in sync if the DGX's address changes.
  # So 127.0.0.1:8000 is not "the DGX's address" at all - it is the LOCAL END of
  # the ssh tunnel, which is the point: it does not move when the box does, so
  # this literal is stable while the box's address is not.
  # (An earlier version of this note said the gx10's Tailscale IP was
  # 100.111.170.95 and unreachable; both halves were wrong. 100.111.170.95 is the
  # DGX Spark, a different machine - see docs/deployment/dgx-spark.md. The gx10 is
  # 100.67.13.78 and IS reachable over Tailscale; what you cannot do is reach its
  # model on that IP, because vLLM there binds 127.0.0.1 and refuses otherwise.
  # The tunnel is how that gets solved, not a workaround for unreachable host.)
  - model_name: "ufo-dgx-model"
    litellm_params:
      model: "openai/qwen38-27b-turbo"
      api_base: "http://127.0.0.1:8000/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: "ufo-dgx-app-model"
    litellm_params:
      model: "openai/qwen38-27b-turbo"
      api_base: "http://127.0.0.1:8000/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  # Two more gx10 models. Both bind 127.0.0.1 on the box (like the brain), so
  # they are reached through ufo-tunnel.service's TAILNET-ONLY forwards
  # (100.67.13.78:18004/18005 -> 127.0.0.1:8004/8005; ufw allows 100.64.0.0/10
  # only), the same way Venus is reached on :18002. See ufo-tunnel.service.
  #
  # :8004 is the REAL Qwen3.8 27B (llama.cpp, Q8_0 GGUF) since 2026-09-27; it
  # replaced qwen35-9b-defiant in that slot. NOTE the name clash: the brain on
  # :8000 (qwen-abliterated, a 35B-A3B) ALSO answers to the name
  # "qwen38-27b-turbo" as a served-model alias, so the ufo-* entries above that
  # say "openai/qwen38-27b-turbo" at :8000 get the 35B, not this 27B.
  - model_name: "gx10-qwen38-27b"
    litellm_params:
      model: "openai/qwen38-27b-turbo"
      api_base: "http://100.67.13.78:18004/v1"
      api_key: "sk-local"
      rpm: 10000
      # Coding sampler from the model card (DavidAU TURBO-Fable 735-882);
      # temperature 0 hurts this model. 16k output: 4 slots share a 262k
      # KV pool (--kv-unified), so long replies do not starve other agents.
      max_tokens: 16384
      temperature: 0.6
      top_p: 0.95
      extra_body:
        top_k: 20
        min_p: 0.0
        chat_template_kwargs:
          enable_thinking: false
  # On-demand models (scripts/dgx/gx10_model_swap.sh 42b|tongyi|27b): only one of
  # the 27B / 42B / Tongyi runs at a time, so these answer only while swapped in.
  - model_name: "gx10-qwen3-42b"
    litellm_params:
      model: "openai/qwen3-42b-coder"
      api_base: "http://100.67.13.78:18006/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 32768
      temperature: 0.5
      top_p: 0.95
      extra_body:
        top_k: 20
        min_p: 0.05
  - model_name: "gx10-tongyi-30b"
    litellm_params:
      model: "openai/tongyi-30b"
      api_base: "http://100.67.13.78:18007/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 32768
      temperature: 0.6
      top_p: 0.95
      extra_body:
        top_k: 20
  - model_name: "gx10-qwen3-0.6b"
    litellm_params:
      model: "openai/qwen3-0.6b"
      api_base: "http://100.67.13.78:18005/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 1000
      temperature: 0.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: "claude-3-7-sonnet"
    litellm_params:
      model: "anthropic/claude-3-7-sonnet-latest"
      api_key: "os.environ/ANTHROPIC_API_KEY"
      max_tokens: 16384
  - model_name: "deepseek-r1"
    litellm_params:
      model: "deepseek/deepseek-reasoner"
      api_key: "os.environ/DEEPSEEK_API_KEY"
      max_tokens: 8000

  - model_name: "featherless-qwen-primary"
    litellm_params:
      model: "openai/mlabonne/Qwen2.5-72B-Instruct-abliterated"
      api_base: "https://api.featherless.ai/v1"
      api_key: "os.environ/FEATHERLESS_API_KEY"
      rpm: 1000
      max_tokens: 4000
  - model_name: "featherless-qwen-secondary"
    litellm_params:
      model: "openai/hugging-quants/Qwen2-72B-Instruct-abliterated"
      api_base: "https://api.featherless.ai/v1"
      api_key: "os.environ/FEATHERLESS_API_KEY"
      rpm: 1000
      max_tokens: 4000
  - model_name: "featherless-qwen-tertiary"
    litellm_params:
      model: "openai/failpy/Qwen2.5-Coder-32B-Instruct-abliterated"
      api_base: "https://api.featherless.ai/v1"
      api_key: "os.environ/FEATHERLESS_API_KEY"
      rpm: 1000
      max_tokens: 4000

router_settings:
  fallbacks:
    - {"ufo-host-model": ["claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-app-model": ["claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-model": ["claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-dgx-model": ["ufo-dgx-app-model", "claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}
    - {"ufo-dgx-app-model": ["ufo-dgx-model", "claude-3-7-sonnet", "featherless-qwen-primary", "featherless-qwen-secondary", "featherless-qwen-tertiary"]}

