# =============================================================================
# UFO Dream Team — LiteLLM Config (August 2026)
# =============================================================================
# Verified best-in-class models for local vision agent:
#   Qwen3-VL-8B-Instruct   on :8080  (HOST_AGENT — #1 OS World benchmark)
#   Gemma 4 12B IT          on :8081  (APP_AGENT  — encoder-free vision)
# =============================================================================

model_list:
  # ---- Dream Team: Local Vision Models ----

  - model_name: "ufo-host-model"
    litellm_params:
      model: "openai/qwen3-vl"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      num_retries: 2

  - model_name: "ufo-app-model"
    litellm_params:
      model: "openai/gemma4"
      api_base: "http://127.0.0.1:8081/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0
      num_retries: 2

  # ---- Legacy single-model alias ----

  - model_name: "ufo-model"
    litellm_params:
      model: "openai/qwen3-vl"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-local"
      rpm: 10000
      max_tokens: 2000
      temperature: 0.0

  # ---- Cloud fallback ----

  - model_name: "gemini-complex"
    litellm_params:
      model: "gemini/gemini-3.7-flash"
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: "gemini-computer-use"
    litellm_params:
      model: "gemini/gemini-3.7-flash"
      api_key: "os.environ/GEMINI_API_KEY"
