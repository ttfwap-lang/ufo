[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufo"
version = "3.0.0"
description = "UFO³: Multi-Device Agent Galaxy (Windows ARM64 + DGX Spark)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Microsoft", email = "ufo@microsoft.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
core = [
    "aiohttp>=3.10", "aiohappyeyeballs>=2.7", "anyio>=4.0",
    "pydantic>=2.10", "pydantic-settings>=2.10", "PyYAML>=6.0",
    "rich>=13.0", "typer>=0.15", "colorama>=0.4",
    "websockets>=12.0", "httpx>=0.28", "tenacity>=9.0", "pybreaker>=1.2",
    "python-dotenv>=1.0", "keyring>=25.0",
    "dependency-injector>=4.45",
    "structlog>=25.0",
    "opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-httpx>=0.49",
    "opentelemetry-instrumentation-aiohttp-client>=0.49",
    "sqlalchemy>=2.0", "alembic>=1.13",
    "fastmcp==3.4.7", "fastmcp-slim==3.4.7", "tabulate>=0.9",
    "faiss-cpu>=1.11", "sentence-transformers>=3.0",
    "langchain-community>=0.3", "langchain-huggingface>=0.1",
]
windows = ["playwright>=1.48"]
dgx = ["ollama>=0.4", "openai>=1.0", "httpx>=0.28"]
galaxy = ["fastapi>=0.115", "uvicorn>=0.32", "websockets>=12.0", "pydantic>=2.10", "pydantic-settings>=2.10"]
eval = ["pytest>=9.0", "pytest-asyncio>=1.4", "pytest-cov>=6.0", "pytest-timeout>=2.3", "ruff>=0.16", "mypy>=1.10", "hypothesis>=6.100", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
ml = [
    "torch>=2.5", "transformers>=4.48",
    "chromadb>=1.0", "langchain>=0.3",
    "langgraph>=0.2", "fastembed>=0.4",
]
native-win32 = ["pywinauto>=0.6.9", "uiautomation>=2.0", "comtypes>=1.4", "pywin32>=312"]
# all extra explicitly lists all packages (uv doesn't recursively expand extra refs)
all = [
    "aiohttp>=3.10", "aiohappyeyeballs>=2.7", "anyio>=4.0",
    "pydantic>=2.10", "pydantic-settings>=2.10", "PyYAML>=6.0",
    "rich>=13.0", "typer>=0.15", "colorama>=0.4",
    "websockets>=12.0", "httpx>=0.28", "tenacity>=9.0", "pybreaker>=1.2",
    "python-dotenv>=1.0", "keyring>=25.0",
    "dependency-injector>=4.45",
    "structlog>=25.0",
    "opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-httpx>=0.49",
    "opentelemetry-instrumentation-aiohttp-client>=0.49",
    "sqlalchemy>=2.0", "alembic>=1.13",
    "fastmcp==3.4.7", "fastmcp-slim==3.4.7", "tabulate>=0.9",
    "faiss-cpu>=1.11", "sentence-transformers>=3.0",
    "langchain-community>=0.3", "langchain-huggingface>=0.1",
    "playwright>=1.48",
    "ollama>=0.4", "openai>=1.0",
    "fastapi>=0.115", "uvicorn>=0.32",
    "pytest>=9.0", "pytest-asyncio>=1.4", "pytest-cov>=6.0", "ruff>=0.16", "mypy>=1.10", "hypothesis>=6.100",
    "pywinauto>=0.6.9", "uiautomation>=2.0", "comtypes>=1.4", "pywin32>=312",
]

[project.scripts]
ufo-terminal = "terminal.__main__:main"
ufo-galaxy = "galaxy.cli:main"
ufo-eval = "eval_suite.cli:main"
ufo = "__main__:main"

[tool.uv.sources]
ufo = {path = "."}

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".git", "__pycache__", "*.egg-info", "logs"]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "E402", "SIM102", "SIM103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
no_implicit_optional = false
exclude = ["logs/", "python_env/", "scripts/legacy/", "legacy/"]

[tool.setuptools]
packages.find = {where = [".."], include = ["ufo", "ufo.*", "ufo_logging", "ufo_logging.*"]}
package-dir = {"" = ".", "ufo_logging" = "ufo_logging"}

[tool.pytest.ini_options]
testpaths = ["tests", "automation/tests", "terminal/tests", "llm/tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/benchmark_harness.py --ignore=tests/load_test_harness.py -q"
markers = [
    "requires_dgx: marks tests requiring DGX Spark hardware",
    "requires_windows: marks tests requiring Windows",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/legacy/*", "scripts/legacy/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]
fail_under = 60