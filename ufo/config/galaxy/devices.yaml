# Device Configuration - YAML Format
# This configuration defines devices for the constellation
# Runtime settings (constellation_id, heartbeat_interval, etc.) are configured in constellation.yaml

devices:
  - device_id: "windowsagent"
    server_url: "ws://localhost:5005/ws"
    os: "windows"
    capabilities:
      - "web_browsing"
      - "office_applications" 
      - "file_management"
      - "send emails"
      - "any windows tasks"
    metadata:
      location: "home_office"
      os: "windows"
      performance: "medium"
      description: "Primary development laptop"
      operation_engineer_email: "hidan.zhang@gmail.com"
      app_log_file: "log_detailed.xlsx"
      sheet_name_for_writing_log_in_excel: "report"
      sender_name: "Zac"
      operation_engineer_name: "Hidan Zhang"
      tips: "If you want to use PowerShell, please launch a new PowerShell window to run the commands."
    auto_connect: false  # enable when a local UFO server+client runs on :5005
    max_retries: 5

  - device_id: "linux_agent_1"
    server_url: "ws://localhost:5001/ws"
    os: "linux"
    capabilities:
      - "server"
    metadata:
      os: "linux"
      performance: "medium"
      logs_file_path: "/root/log/log1.txt"
      dev_path: "/root/dev1/"
      warning_log_pattern: "WARN"
      error_log_pattern: "ERROR or FATAL"
    auto_connect: false
    max_retries: 5

  - device_id: "linux_agent_2"
    server_url: "ws://localhost:5002/ws"
    os: "linux"
    capabilities:
      - "server"
    metadata:
      os: "linux"
      performance: "medium"
      logs_file_path: "/root/log/log2.txt"
      dev_path: "/root/dev2/"
      warning_log_pattern: "WARN"
      error_log_pattern: "ERROR or FATAL"
    auto_connect: false
    max_retries: 5

  - device_id: "linux_agent_3"
    server_url: "ws://localhost:5003/ws"
    os: "linux"
    capabilities:
      - "server"
    metadata:
      os: "linux"
      performance: "medium"
      logs_file_path: "/root/log/log3.txt"
      dev_path: "/root/dev3/"
      warning_log_pattern: "WARN"
      error_log_pattern: "ERROR or FATAL"
    auto_connect: false
    max_retries: 5

  - device_id: "dgx_gx10"
    # Reached through the SSH tunnel (-L 5001:127.0.0.1:5001); the token comes
    # from the UFO_DGX_WS_TOKEN environment variable, never from this file.
    server_url: "ws://localhost:5001/ws?token=${UFO_DGX_WS_TOKEN}"
    os: "linux"
    capabilities:
      - "linux shell commands"
      - "server administration"
      - "gpu and system monitoring"
      - "file inspection on the dgx"
    metadata:
      os: "linux"
      performance: "high"
      description: "NVIDIA DGX Spark (GB10) on the LAN; hosts the Ollama and vLLM models"
      tips: "Only allow-listed read-mostly commands run here (ls, cat, grep, find, df, ps, nvidia-smi...)."
    auto_connect: true
    max_retries: 5
