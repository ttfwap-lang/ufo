# Device Configuration - YAML Format
# This configuration defines devices for the constellation
# Runtime settings (constellation_id, heartbeat_interval, etc.) are configured in constellation.yaml
# Tokens come from environment variables (expanded at load time), never from this file.

devices:
  - device_id: "windowsagent"
    # This PC. Needs a local UFO server + client (see tests/eval_suite/live/run_live.py
    # or docs/testing.md): server on 127.0.0.1:5005 with UFO_WS_TOKEN=$UFO_WIN_WS_TOKEN.
    server_url: "ws://localhost:5005/ws?token=${UFO_WIN_WS_TOKEN}"
    os: "windows"
    capabilities:
      - "web_browsing"
      - "office_applications"
      - "file_management"
      - "any windows tasks"
    metadata:
      os: "windows"
      performance: "medium"
      description: "Windows 11 desktop driven by UFO (Word, Excel, PowerPoint, Edge, Chrome, Paint, Notepad)"
      tips: "Write output files into the folder named in the request; do not change system settings."
    auto_connect: false  # enabled at runtime when the local server+client are running
    max_retries: 5

  - device_id: "dgx_gx10"
    # Reached through the SSH tunnel (-L 5001:127.0.0.1:5001); the token comes
    # from the UFO_DGX_WS_TOKEN environment variable, never from this file.
    server_url: "ws://localhost:5001/ws?token=${UFO_DGX_WS_TOKEN}"
    os: "linux"
    capabilities:
      - "linux shell commands"
      - "server administration"
      - "gpu and system monitoring"
      - "file inspection on the dgx"
    metadata:
      os: "linux"
      performance: "high"
      description: "NVIDIA DGX Spark (GB10) on the LAN; hosts the Ollama and vLLM models"
      tips: "Only allow-listed read-mostly commands run here (ls, cat, grep, find, df, ps, nvidia-smi...)."
    auto_connect: true
    max_retries: 5
