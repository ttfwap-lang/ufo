# =============================================================================
# UFO DGX Network LLM Configuration
# =============================================================================
# Connects to the models running on the NVIDIA DGX Spark (gx10), all reached
# through the SSH tunnel on 127.0.0.1 (see scripts/gx10_tunnel_*.ps1):
#   - qwen38-27b-turbo (llama.cpp OpenAI-compat server on :8000) is the agent LLM
#       and serves every role: HOST_AGENT, APP_AGENT, BACKUP_AGENT and EVALUATION_AGENT.
#       The underlying checkpoint (Qwen3.6-35B-A3B-abliterated, NVFP4) is multimodal
#       (Qwen3_5MoeForConditionalGeneration, has a vision tower), so VISUAL_MODE works.
#       EXTRA_BODY is REQUIRED, not cosmetic: without enable_thinking:false the model
#       emits a long reasoning block that eats the entire completion budget and
#       returns an empty `content`. With it, a short reply is 3 tokens instead of 34.
#   - ui-venus (vLLM on :8002) is the pixel grounder behind click_on_description; it is
#     configured in system.yaml (GROUNDING_MODEL), not here. scripts/dgx/venus_run.sh.
#     It is ALSO a thinking model and needs the same enable_thinking:false override;
#     venus_client.py sets it automatically.
#   - OmniParser V2 (:7861, POST /api/parse) is the vision-fallback rank. It runs on
#     CPU on the GB10 because the unified memory is fully used by the two LLM pools.
#   - Ollama (:11434) is not used by this profile and currently has no models pulled.
#
# Set the DGX host via environment variable (127.0.0.1 through the tunnel). The
# Tailscale IP 100.111.170.95 is NOT reachable from this host (connections time
# out), so keep UFO_DGX_HOST=127.0.0.1 and rely on the tunnel.
#
# To switch to this config from the widget:
#   Terminal -> AI Backend -> Switch to DGX (widget will prompt for host IP)
# =============================================================================

HOST_AGENT:
  VISUAL_MODE: true
  REASONING_MODEL: false
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8000/v1"
  API_KEY: "sk-local"
  API_MODEL: "qwen38-27b-turbo"
  EXTRA_BODY: {chat_template_kwargs: {enable_thinking: false}}
  MAX_IMAGE_PIXELS: 1800000  # bounds screenshot prefill cost (~1.8k image tokens each). Not a correctness limit: the model's tokenizer.json once truncated at 2048 tokens (fixed on the DGX, backup tokenizer.json.bak-20260922)
  PROMPT: ufo/prompts/share/base/host_agent.yaml
  EXAMPLE_PROMPT: ufo/prompts/examples/{mode}/host_agent_example.yaml

APP_AGENT:
  VISUAL_MODE: true
  REASONING_MODEL: false
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8000/v1"
  API_KEY: "sk-local"
  API_MODEL: "qwen38-27b-turbo"
  EXTRA_BODY: {chat_template_kwargs: {enable_thinking: false}}
  MAX_IMAGE_PIXELS: 1800000  # bounds screenshot prefill cost (~1.8k image tokens each). Not a correctness limit: the model's tokenizer.json once truncated at 2048 tokens (fixed on the DGX, backup tokenizer.json.bak-20260922)
  PROMPT: ufo/prompts/share/base/app_agent.yaml
  EXAMPLE_PROMPT: ufo/prompts/examples/{mode}/app_agent_example.yaml
  EXAMPLE_PROMPT_AS: ufo/prompts/examples/{mode}/app_agent_example_as.yaml

BACKUP_AGENT:
  VISUAL_MODE: true
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8000/v1"
  API_KEY: "sk-local"
  API_MODEL: "qwen38-27b-turbo"
  EXTRA_BODY: {chat_template_kwargs: {enable_thinking: false}}
  MAX_IMAGE_PIXELS: 1800000  # bounds screenshot prefill cost (~1.8k image tokens each). Not a correctness limit: the model's tokenizer.json once truncated at 2048 tokens (fixed on the DGX, backup tokenizer.json.bak-20260922)

EVALUATION_AGENT:
  VISUAL_MODE: false
  REASONING_MODEL: false
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8000/v1"
  API_KEY: "sk-local"
  API_MODEL: "qwen38-27b-turbo"

OMNIPARSER:
  ENDPOINT: ''
  BOX_THRESHOLD: 0.02
  IOU_THRESHOLD: 0.1
  USE_PADDLEOCR: true
  IMGSZ: 1024

MAX_TOKENS: 8192
MAX_RETRY: 3
TEMPERATURE: 0.0
TOP_P: 0.0
TIMEOUT: 120
APP_API_PROMPT_ADDRESS:
  WINWORD.EXE: ufo/prompts/apps/word/api.yaml
  EXCEL.EXE: ufo/prompts/apps/excel/api.yaml
  msedge.exe: ufo/prompts/apps/web/api.yaml
  chrome.exe: ufo/prompts/apps/web/api.yaml
  dual-core-pdf-pipeline.exe: ufo/prompts/apps/bankfidelity/api.yaml
  dual-core-pdf-pipeline: ufo/prompts/apps/bankfidelity/api.yaml
  BankFidelity_Stable.exe: ufo/prompts/apps/bankfidelity/api.yaml
