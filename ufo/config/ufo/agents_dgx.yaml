# =============================================================================
# UFO DGX Network LLM Configuration
# =============================================================================
# Connects to Qwen3-VL models running on a network-attached NVIDIA DGX Spark
# via OpenAI-compatible llama-server endpoints (no local LiteLLM proxy needed).
#
# Set the DGX host IP via environment variable:
#   set UFO_DGX_HOST=192.168.1.10   (or your DGX's network IP)
#
# Default DGX host: 192.168.1.10
# Default Qwen port: 8080
#
# To switch to this config from the widget:
#   Terminal → AI Backend → Switch to DGX (widget will prompt for host IP)
#
# To switch back to cloud:
#   Terminal → AI Backend → Switch to Cloud
# =============================================================================

HOST_AGENT:
  VISUAL_MODE: true
  REASONING_MODEL: false
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8080/v1"
  API_KEY: "sk-local"
  API_MODEL: "Qwen3-VL-8B"
  PROMPT: ufo/prompts/share/base/host_agent.yaml
  EXAMPLE_PROMPT: ufo/prompts/examples/{mode}/host_agent_example.yaml

APP_AGENT:
  VISUAL_MODE: true
  REASONING_MODEL: false
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8081/v1"
  API_KEY: "sk-local"
  API_MODEL: "Gemma-4-12B"
  PROMPT: ufo/prompts/share/base/app_agent.yaml
  EXAMPLE_PROMPT: ufo/prompts/examples/{mode}/app_agent_example.yaml
  EXAMPLE_PROMPT_AS: ufo/prompts/examples/{mode}/app_agent_example_as.yaml

BACKUP_AGENT:
  VISUAL_MODE: true
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8080/v1"
  API_KEY: "sk-local"
  API_MODEL: "Qwen3-VL-8B"

EVALUATION_AGENT:
  VISUAL_MODE: false
  REASONING_MODEL: false
  API_TYPE: openai
  API_BASE: "http://${UFO_DGX_HOST}:8081/v1"
  API_KEY: "sk-local"
  API_MODEL: "Gemma-4-12B"

OMNIPARSER:
  ENDPOINT: ''
  BOX_THRESHOLD: 0.02
  IOU_THRESHOLD: 0.1
  USE_PADDLEOCR: true
  IMGSZ: 1024

MAX_TOKENS: 2000
MAX_RETRY: 3
TEMPERATURE: 0.0
TOP_P: 0.0
TIMEOUT: 120
APP_API_PROMPT_ADDRESS:
  WINWORD.EXE: ufo/prompts/apps/word/api.yaml
  EXCEL.EXE: ufo/prompts/apps/excel/api.yaml
  msedge.exe: ufo/prompts/apps/web/api.yaml
  chrome.exe: ufo/prompts/apps/web/api.yaml
