# UFO Agent Configurations — Cloud-First Non-Gemini Architecture
# Primary VLM: Anthropic Claude 3.7 Sonnet (Hybrid Thinking Mode)
# Enterprise Backup: OpenAI GPT-4o
# Evaluation & Fast Reasoning: DeepSeek Reasoner (R1)
#
# Hardware / OS: Windows 11 Desktop

HOST_AGENT:
  VISUAL_MODE: true
  REASONING_MODEL: true
  API_TYPE: claude
  API_KEY: ${ANTHROPIC_API_KEY}
  API_MODEL: claude-3-7-sonnet-latest
  PROMPT: ufo/prompts/share/base/host_agent.yaml
  EXAMPLE_PROMPT: ufo/prompts/examples/{mode}/host_agent_example.yaml

APP_AGENT:
  VISUAL_MODE: true
  REASONING_MODEL: true
  API_TYPE: claude
  API_KEY: ${ANTHROPIC_API_KEY}
  API_MODEL: claude-3-7-sonnet-latest
  PROMPT: ufo/prompts/share/base/app_agent.yaml
  EXAMPLE_PROMPT: ufo/prompts/examples/{mode}/app_agent_example.yaml
  EXAMPLE_PROMPT_AS: ufo/prompts/examples/{mode}/app_agent_example_as.yaml

BACKUP_AGENT:
  VISUAL_MODE: true
  REASONING_MODEL: false
  API_TYPE: openai
  API_BASE: "https://api.openai.com/v1"
  API_KEY: ${OPENAI_API_KEY}
  API_MODEL: gpt-4o
  PROMPT: ufo/prompts/share/base/app_agent.yaml

EVALUATION_AGENT:
  VISUAL_MODE: false
  REASONING_MODEL: true
  API_TYPE: deepseek
  API_BASE: "https://api.deepseek.com/v1"
  API_KEY: ${DEEPSEEK_API_KEY}
  API_MODEL: deepseek-reasoner

OMNIPARSER:
  ENDPOINT: ''
  BOX_THRESHOLD: 0.02
  IOU_THRESHOLD: 0.1
  USE_PADDLEOCR: true
  IMGSZ: 1024

MAX_TOKENS: 16384
MAX_RETRY: 3
TEMPERATURE: 0.0
TOP_P: 0.0
TIMEOUT: 120

APP_API_PROMPT_ADDRESS:
  WINWORD.EXE: ufo/prompts/apps/word/api.yaml
  EXCEL.EXE: ufo/prompts/apps/excel/api.yaml
  msedge.exe: ufo/prompts/apps/web/api.yaml
  chrome.exe: ufo/prompts/apps/web/api.yaml
  dual-core-pdf-pipeline.exe: ufo/prompts/apps/bankfidelity/api.yaml
  BankFidelity_Stable.exe: ufo/prompts/apps/bankfidelity/api.yaml
