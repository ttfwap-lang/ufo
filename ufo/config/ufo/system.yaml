# UFO System Configuration

# LLM Parameters
MAX_TOKENS: 16384  # The max token limit for the response completion (16K needed for thinking models like Gemini 3.7 Flash)
MAX_RETRY: 3  # The max retry limit for the response completion
TEMPERATURE: 0.0  # The temperature of the model: the lower the value, the more consistent
TOP_P: 0.0  # The top_p of the model: the lower the value, the more conservative
TIMEOUT: 120  # The call timeout(s), default is 2 mins (120s needed for local CPU inference)

# Control Backend
CONTROL_BACKEND: ["uia"]  # The backend for control action: uia, omniparser
IOU_THRESHOLD_FOR_MERGE: 0.1  # The iou threshold for merging the boxes between controls

# Execution Limits
MAX_STEP: 50  # The max step limit for completing the user request
MAX_ROUND: 10  # The max round limit for completing the user request
SLEEP_TIME: 0.2  # The sleep time between each step to wait for the window to be ready
VISUAL_MODE: False
RECTANGLE_TIME: 1

# Action Configuration
ACTION_SEQUENCE: False  # Whether to output the action sequence (from legacy config)
SHOW_VISUAL_OUTLINE_ON_SCREEN: False  # Skip rendering visual outline on screen if not necessary
MAXIMIZE_WINDOW: False  # Whether to maximize the application window before the action
JSON_PARSING_RETRY: 3  # The retry times for the json parsing

# Safety
SAFE_GUARD: True  # Whether to use the safe guard to prevent sensitive operations (from legacy config)
CONTROL_LIST: ["Button", "Edit", "TabItem", "Document", "ListItem", "MenuItem", "ScrollBar", "TreeItem", "Hyperlink", "ComboBox", "RadioButton", "Spinner", "CheckBox", "Group", "Text"]

# History
HISTORY_KEYS: ["step", "subtask", "action_representation", "user_confirm"]

# Annotation
ANNOTATION_COLORS:
  "Button": "#FFF68F"
  "Edit": "#A5F0B5"
  "TabItem": "#A5E7F0"
  "Document": "#FFD18A"
  "ListItem": "#D9C3FE"
  "MenuItem": "#E7FEC3"
  "ScrollBar": "#FEC3F8"
  "TreeItem": "#D6D6D6"
  "Hyperlink": "#91FFEB"
  "ComboBox": "#D8B6D4"

HIGHLIGHT_BBOX: True
ANNOTATION_FONT_SIZE: 22

# Control Actions
CLICK_API: "click_input"  # The click API
AFTER_CLICK_WAIT: 0  # The wait time after clicking in seconds
INPUT_TEXT_API: "set_text"  # The input text API: type_keys or set_text
INPUT_TEXT_ENTER: False  # Whether to press enter after typing the text
INPUT_TEXT_INTER_KEY_PAUSE: 0.05  # The pause time between each key press


# Logging
PRINT_LOG: False  # Whether to print the log
CONCAT_SCREENSHOT: False  # Whether to concat the screenshot for the control item
LOG_LEVEL: "DEBUG"  # The log level
INCLUDE_LAST_SCREENSHOT: True  # Whether to include the last screenshot in the observation
REQUEST_TIMEOUT: 250  # The call timeout for vision model requests
LOG_XML: False  # Whether to log the xml file at every step
LOG_TO_MARKDOWN: True  # Whether to save the log to markdown file
SCREENSHOT_TO_MEMORY: True  # Whether to allow the screenshot to memory

# Image Performance
DEFAULT_PNG_COMPRESS_LEVEL: 1  # The compress level for PNG image, 0-9

# Save Options
SAVE_UI_TREE: False  # Whether to save the UI tree at each step
SAVE_FULL_SCREEN: False  # Whether to save the full screen at each step

# Task Management
TASK_STATUS: True  # Whether to record the status of the tasks in batch execution mode
SAVE_EXPERIENCE: "always_not"  # always, always_not, ask, auto

# Evaluation
EVA_SESSION: False  # Whether to include the session in the evaluation
EVA_ROUND: False
EVA_ALL_SCREENSHOTS: True  # Whether to include all the screenshots in the evaluation

# Customization
ASK_QUESTION: False  # Whether to allow the agent to ask questions
USE_CUSTOMIZATION: False  # Whether to use the customization
QA_PAIR_FILE: "customization/global_memory.jsonl"
QA_PAIR_NUM: 20  # The number of QA pairs for the customization

# Omniparser
OMNIPARSER:
  ENDPOINT: ""  # Set to your OmniParser service URL (e.g., http://localhost:8001)
  BOX_THRESHOLD: 0.05
  IOU_THRESHOLD: 0.1
  USE_PADDLEOCR: True
  IMGSZ: 640

# Control Filtering Configuration
CONTROL_FILTER_TYPE: []  # List of control filter types: 'TEXT', 'SEMANTIC', 'ICON'
CONTROL_FILTER_TOP_K_PLAN: 2  # Control filter effect on top k plans from UFO
CONTROL_FILTER_TOP_K_SEMANTIC: 15  # Control filter top k for semantic similarity
CONTROL_FILTER_TOP_K_ICON: 15  # Control filter top k for icon similarity
CONTROL_FILTER_MODEL_SEMANTIC_NAME: "all-MiniLM-L6-v2"  # Semantic similarity model
CONTROL_FILTER_MODEL_ICON_NAME: "clip-ViT-B-32"  # Icon similarity model


# MCP (Model Context Protocol) Integration
USE_MCP: True  # Whether to enable MCP integration for tool execution
MCP_SERVERS_CONFIG: "config/ufo/mcp.yaml"  # Path to MCP servers configuration (updated to new path)
MCP_PREFERRED_APPS: ["POWERPNT.EXE", "WINWORD.EXE", "EXCEL.EXE", "powerpoint", "word", "excel", "web", "shell", "hardware", "hardwareagent"]
MCP_FALLBACK_TO_UI: True  # Whether to fallback to UI automation if MCP execution fails
MCP_INSTRUCTIONS_PATH: "ufo/config/mcp_instructions"  # Path to MCP instructions files
MCP_TOOL_TIMEOUT: 30  # Timeout in seconds for MCP tool execution
MCP_LOG_EXECUTION: False  # Whether to log MCP tool execution details

# Enabled Third-Party Agents
ENABLED_THIRD_PARTY_AGENTS: []

# Circuit Breaker — Auto-routes to backup agent after consecutive LLM failures
CIRCUIT_BREAKER:
  ENABLED: true
  FAILURE_THRESHOLD: 3           # Consecutive failures to trip the breaker
  RESET_TIMEOUT_SECONDS: 300     # 5 min cooldown before retrying the primary
  HALF_OPEN_MAX_TRIALS: 1        # Max probe calls admitted in HALF-OPEN state
  FALLBACK_AGENT: "BACKUP_AGENT"

# Dead-Letter Queue — Persists diagnostic snapshots on total fallback exhaustion
DLQ:
  ENABLED: true
  SNAPSHOT_DIR: "logs/dlq/snapshots"
  WEBHOOK_URL: ""                # Empty = log-only; set URL for external alerting
  MAX_SNAPSHOTS: 100             # Auto-prune oldest when limit reached

# Vision Fallback — Tri-stage grounding for ElementNotFoundError recovery
VISION_FALLBACK:
  ENABLED: true
  RANK_1_PRIMARY: "reducto_agentic_ocr"
  RANK_2_SECONDARY: "omniparser_v2"
  RANK_3_BACKUP: "cloud_vlm"
  CONFIDENCE_THRESHOLD: 0.85     # Below this, cascade from primary to secondary/backup
  CLOUD_VLM_AGENT: "BACKUP_AGENT"  # Which agent config to use for Cloud VLM fallback

# UI Settlement — Hybrid timeout + structural UIA checks
UI_SETTLEMENT:
  HARD_TIMEOUT_SECONDS: 5.0
  PIXEL_CONVERGENCE_THRESHOLD: 5  # Pixel stddev threshold for convergence
  CHECK_FOREGROUND_HWND: true     # Verify foreground window matches expected HWND
  CHECK_CONTROL_ENABLED: true     # Verify target control is enabled after action

# Execution Modes — "Dual-Personality" architecture
# strict_determinism=true → Pure DAG engine (Tickets 1-3), no exploratory features
# strict_determinism=false → DAG + ReAct/RAG/SoM for non-critical tasks
# IMPORTANT: is_irrevocable=True nodes ALWAYS force DAG mode regardless of these flags
EXECUTION_MODES:
  STRICT_DETERMINISM: true         # If true, disables ReAct and RAG globally
  HUMAN_IN_THE_LOOP: false         # If true, prompt operator on fatal failure instead of DLQ

# Legacy Features — Optional subsystems gated behind feature flags
LEGACY_FEATURES:
  ENABLE_EXPERIENCE_MEMORY: false  # ChromaDB vector recall of past successful runs
  ENABLE_SET_OF_MARKS: false       # Numbered bounding box annotation as vision fallback
  ENABLE_API_PLUGINS: true         # Bypass GUI via direct COM/API when available
  EXPERIENCE_DB_PATH: "memory/chroma_db"
  SOM_SIMILARITY_THRESHOLD: 0.3   # ChromaDB distance threshold for experience recall

# Telemetry — Token accounting and daily budget enforcement
TELEMETRY:
  ENABLED: true
  DAILY_BUDGET_USD: 50.0           # Hard lockout when daily spend exceeds this
  WARNING_THRESHOLD_PCT: 80        # Log warning at 80% of budget
  LOG_EVERY_CALL: false            # If true, log every LLM call cost (verbose)
  PERSIST_PATH: "logs/telemetry"   # Daily cost logs for audit trail

# Fleet Daemon — 24/7 event-driven background runner
FLEET_DAEMON:
  ENABLED: false                   # Set true to run in headless daemon mode
  HEARTBEAT_INTERVAL_SECONDS: 60   # Health check log interval
  MAX_CONCURRENT_WORKFLOWS: 1      # Max parallel HostAgent workflows
  WEBHOOK_PORT: 8765               # HTTP port for external event triggers
  ALLOWED_TRIGGER_TYPES:           # Whitelist of accepted event types
    - file_drop
    - webhook
    - scheduled
    - manual

# Security — Zero-Trust auth vault and PII redaction
SECURITY:
  # Auth Vault — Secure credential injection via Windows Credential Manager
  VAULT:
    ENABLED: true
    SERVICE_NAME: "BankFidelity_UFO"       # keyring service name
    TYPE_INTERVAL: 0.02                     # Seconds between keystrokes during injection
    SCRUB_MEMORY: true                      # Overwrite credential in memory after use

  # PII Redactor — Scrub financial data before cloud transmission
  REDACTOR:
    ENABLED: true
    REDACT_FOR_CLOUD_ONLY: true             # Skip redaction for local (Layer 1) models
    BLUR_KERNEL_SIZE: 51                    # Gaussian blur kernel (must be odd)
    REDACTION_MARKER: "[REDACTED]"
    CUSTOM_PATTERNS: []                     # Additional regex patterns to redact

# Distributed Fleet — Redis-backed multi-VM orchestration
DISTRIBUTED_FLEET:
  ENABLED: false                            # Set true for multi-VM fleet mode
  REDIS_URL: "redis://127.0.0.1:6379/0"    # Redis connection URL
  WORKER_ID: "auto"                         # "auto" = hostname+pid, or explicit ID
  QUEUE_NAME: "ufo:queue:bankfidelity_tasks"
  LOCK_EXPIRY_SECONDS: 300                  # Max lock duration (5 min)
  LOCK_PREFIX: "ufo:lock:action"
  HEARTBEAT_KEY: "ufo:fleet:heartbeats"
  HEARTBEAT_INTERVAL_SECONDS: 10            # How often workers report alive
  WATCHDOG_TIMEOUT_SECONDS: 30              # Declare dead after this silence
  DLQ_QUEUE: "ufo:queue:dlq"               # Redis DLQ for orphaned tasks
  FETCH_TIMEOUT_SECONDS: 5                  # Block timeout for task fetch

# Control Plane — Operator monitoring and HITL gateway
CONTROL_PLANE:
  ENABLED: false                            # Set true to enable the API server
  HOST: "0.0.0.0"                           # Bind address
  PORT: 8800                                # API port
  API_KEY: ""                               # If set, required in X-API-Key header
  REDIS_URL: "redis://127.0.0.1:6379/0"
  HITL_DEFAULT_TIMEOUT_MINUTES: 15          # Auto-ABORT if no operator responds
